[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mimir-rag"
version = "0.1.2"
description = "Local personal knowledge retrieval with verified citations for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Seungwoo321" }]
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.1,<2.4",
  "pydantic>=2.10,<3",
  "pypdf[fonts]>=6.19,<7",
  "PyYAML>=6,<7",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11",
  "types-PyYAML>=6",
]

[project.scripts]
mimir-rag = "mimir_rag.main:main"

[project.urls]
Repository = "https://github.com/Seungwoo321/mimir-rag"
Issues = "https://github.com/Seungwoo321/mimir-rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mimir_rag"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "mimir_rag/data/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/skills", "/commands", "/scripts", "/.claude-plugin", "/.codex-plugin", "/.agents", "/README.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/uv.lock", "/.env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true
